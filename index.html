<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat To Land</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chat To Land">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
  :root{--bg:#f4f4f5;--card:#fff;--ink:#111;--muted:#6b7280;--line:#e5e7eb;--accent:#111;--warn:#d97706;--ok:#059669}
  *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100vh}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 12px}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
  #login{max-width:340px;margin:12vh auto;background:var(--card);padding:28px;border-radius:14px;display:flex;flex-direction:column;gap:10px}
  #app{display:none;height:100vh;grid-template-columns:320px 1fr;grid-template-rows:52px 1fr}
  header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;flex:1}
  header select{width:auto}
  #list{background:var(--card);border-right:1px solid var(--line);overflow-y:auto}
  .tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
  .tabs button{flex:1;padding:6px;font-size:13px}.tabs button.on{background:var(--accent);color:#fff}
  .conv{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv:hover,.conv.sel{background:#f9fafb}
  .conv .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
  .conv .prev{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:#eee}
  .tag.waiting{background:#fef3c7;color:var(--warn)}.tag.open{background:#d1fae5;color:var(--ok)}.tag.bot{background:#e0e7ff;color:#4338ca}
  #chat{display:flex;flex-direction:column;min-height:0}
  #chathead{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  #chathead .info{flex:1;font-size:13px;color:var(--muted)}#chathead .info b{color:var(--ink);font-size:15px}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:70%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .m small{display:block;font-size:11px;opacity:.6;margin-top:4px}
  .visitor{align-self:flex-start;background:#fff;border:1px solid var(--line)}
  .bot{align-self:flex-end;background:#e0e7ff}.agent{align-self:flex-end;background:var(--accent);color:#fff}
  .system{align-self:center;font-size:12px;color:var(--muted)}
  #composer{display:flex;gap:8px;padding:12px;background:var(--card);border-top:1px solid var(--line)}
  #composer textarea{height:44px;resize:none}
  .empty{margin:auto;color:var(--muted)}
  .pcards{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .pcard{width:150px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px;white-space:normal}
  .pcard img{width:100%;height:90px;object-fit:contain;display:block;background:#fff}
  .pcard div{padding:6px 8px}.pcard b{display:block;font-size:12px}.pcard s{color:var(--muted);margin-left:4px}
  #picker{display:none;border-top:1px solid var(--line);background:var(--card);padding:10px 12px;max-height:45vh;overflow-y:auto}
  #picker.open{display:block}
  #picker .row{display:flex;gap:8px;margin-bottom:8px}
  #picker .res{display:flex;flex-direction:column;gap:6px}
  #picker .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px}
  #picker .it img{width:52px;height:52px;object-fit:contain;flex:none}
  #picker .it .t{flex:1;font-size:13px}#picker .it .t small{display:block;color:var(--muted)}
  .oos{color:#b91c1c}
  @media (max-width:760px){#app{grid-template-columns:1fr}#list{display:var(--list,block)}#chat{display:var(--chat,none)}}
</style>
</head>
<body>

<form id="login">
  <h2 style="margin:0 0 6px">Painel do Chat</h2>
  <input id="email" type="email" placeholder="E-mail" required>
  <input id="pass" type="password" placeholder="Senha" required>
  <button class="primary">Entrar</button>
  <div id="loginerr" style="color:#b91c1c;font-size:13px"></div>
</form>

<div id="app">
  <header>
    <h1>Painel do Chat</h1>
    <select id="store"></select>
    <button id="logout">Sair</button>
  </header>
  <aside id="list">
    <div class="tabs">
      <button data-f="waiting" class="on">Aguardando</button>
      <button data-f="open">Abertas</button>
      <button data-f="bot">Bot</button>
      <button data-f="closed">Fechadas</button>
    </div>
    <div id="convs"></div>
  </aside>
  <main id="chat"><div class="empty">Selecione uma conversa</div></main>
</div>

<script>
// Endereço da função do chat no Supabase; a URL e a chave pública vêm dela.
const CHAT_FUNCTION_URL = "https://zpnsxqmvnkrjujzsrnmg.supabase.co/functions/v1/chat";
let sb = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (t) => new Date(t).toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
const LABEL = { bot:"Bot", waiting:"Aguardando", open:"Aberta", closed:"Fechada" };

let me = null, storeId = null, filter = "waiting", current = null, convs = [], lastMsg = {};

(async () => {
  const cfg = await fetch(CHAT_FUNCTION_URL).then((r) => r.json());
  sb = supabase.createClient(cfg.url, cfg.anonKey);
  // Não chamar o Supabase dentro do callback (trava a sessão salva ao reabrir o painel): adia com setTimeout.
  sb.auth.onAuthStateChange((_e, session) => {
    setTimeout(() => { if (session) boot(session.user); else if (me) location.reload(); }, 0);
  });
})();

$("#login").onsubmit = async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value, password: $("#pass").value });
  $("#loginerr").textContent = error ? "Não foi possível entrar: " + error.message : "";
};
$("#logout").onclick = () => sb.auth.signOut();

async function boot(user) {
  if (me) return; me = user;
  $("#login").style.display = "none"; $("#app").style.display = "grid";
  const { data: stores } = await sb.from("stores").select("id, name").order("name");
  if (!stores?.length) { $("#chat").innerHTML = '<div class="empty">Seu usuário ainda não está ligado a nenhuma loja.</div>'; return; }
  $("#store").innerHTML = stores.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("#store").onchange = () => { storeId = $("#store").value; current = null; renderChat(); loadConvs(); };
  storeId = stores[0].id;
  await loadConvs();
  sb.channel("panel")
    .on("postgres_changes", { event: "*", schema: "public", table: "conversations" }, () => loadConvs())
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (p) => onMessage(p.new))
    .subscribe();
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}

// No celular o navegador pausa a página em segundo plano: ao voltar, recarrega a lista.
document.addEventListener("visibilitychange", () => { if (!document.hidden && me && storeId) loadConvs(); });

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; renderList();
});

async function loadConvs() {
  const { data } = await sb.from("conversations").select("*").eq("store_id", storeId)
    .order("last_message_at", { ascending: false }).limit(200);
  convs = data ?? [];
  const ids = convs.map((c) => c.id);
  if (ids.length) {
    const { data: msgs } = await sb.from("messages").select("conversation_id, body, sender, created_at")
      .in("conversation_id", ids).order("created_at", { ascending: false }).limit(1000);
    lastMsg = {}; (msgs ?? []).forEach((m) => { if (!lastMsg[m.conversation_id]) lastMsg[m.conversation_id] = m; });
  }
  updateTabCounts(); renderList();
  if (current) { current = convs.find((c) => c.id === current.id) ?? current; renderHead(); }
}

function updateTabCounts() {
  document.querySelectorAll(".tabs button").forEach((b) => {
    const n = convs.filter((c) => c.status === b.dataset.f).length;
    b.textContent = LABEL[b.dataset.f] + (n && b.dataset.f !== "closed" ? ` (${n})` : "");
  });
}

function renderList() {
  const rows = convs.filter((c) => c.status === filter);
  $("#convs").innerHTML = rows.length ? rows.map((c) => `
    <div class="conv ${current?.id === c.id ? "sel" : ""}" data-id="${c.id}">
      <div class="top"><span>${esc(c.visitor_name || c.visitor_email || "Visitante " + c.id.slice(0, 4))}</span><span class="tag ${c.status}">${LABEL[c.status]}</span></div>
      <div class="prev">${esc(lastMsg[c.id]?.body ?? "")}</div>
      <div class="prev" style="font-size:11px">${fmt(c.last_message_at)}</div>
    </div>`).join("") : '<div class="empty" style="padding:20px">Nada aqui.</div>';
  document.querySelectorAll(".conv").forEach((el) => el.onclick = () => openConv(el.dataset.id));
}

async function openConv(id) {
  current = convs.find((c) => c.id === id);
  renderChat(); renderList();
  document.documentElement.style.setProperty("--list", "none"); document.documentElement.style.setProperty("--chat", "flex");
  const { data } = await sb.from("messages").select("*").eq("conversation_id", id).order("created_at");
  $("#msgs").innerHTML = ""; (data ?? []).forEach(addMsg);
}

function renderChat() {
  if (!current) { $("#chat").innerHTML = '<div class="empty">Selecione uma conversa</div>'; return; }
  $("#chat").innerHTML = `
    <div id="chathead"></div>
    <div id="msgs"></div>
    <div id="picker"><div class="row"><input id="pq" placeholder="Buscar produto (ex.: huntsman, alpine, capacete)"><button type="button" id="pclose">Fechar</button></div><div class="res"></div></div>
    <form id="composer"><button type="button" id="pbtn" title="Enviar cartão de produto">🛍 Produto</button><textarea placeholder="Responder... (Enter envia, Shift+Enter quebra linha)"></textarea><button class="primary">Enviar</button></form>`;
  setupPicker();
  renderHead();
  const ta = $("#composer textarea");
  ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } };
  $("#composer").onsubmit = async (e) => {
    e.preventDefault();
    const body = ta.value.trim(); if (!body) return;
    ta.value = "";
    if (current.status !== "open") await setStatus("open");
    const { error } = await sb.from("messages").insert({ conversation_id: current.id, sender: "agent", agent_id: me.id, body });
    if (error) alert("Erro ao enviar: " + error.message);
  };
}

function renderHead() {
  if (!$("#chathead")) return;
  const c = current;
  $("#chathead").innerHTML = `
    <button id="back" style="display:none">←</button>
    <div class="info"><b>${esc(c.visitor_name || c.visitor_email || "Visitante " + c.id.slice(0, 4))}</b> <span class="tag ${c.status}">${LABEL[c.status]}</span><br>
      ${c.page_url ? `Página: <a href="${esc(c.page_url)}" target="_blank">${esc(c.page_url.replace(/^https?:\/\//, "").slice(0, 60))}</a>` : ""}</div>
    ${c.status !== "open" ? '<button class="primary" data-s="open">Assumir</button>' : ""}
    ${c.status !== "bot" ? '<button data-s="bot">Devolver ao bot</button>' : ""}
    ${c.status !== "closed" ? '<button data-s="closed">Encerrar</button>' : ""}`;
  $("#chathead").querySelectorAll("button[data-s]").forEach((b) => b.onclick = () => setStatus(b.dataset.s));
  if (matchMedia("(max-width:760px)").matches) {
    $("#back").style.display = ""; $("#back").onclick = () => { document.documentElement.style.setProperty("--list", "block"); document.documentElement.style.setProperty("--chat", "none"); };
  }
}

async function setStatus(s) {
  const patch = { status: s, assigned_agent: s === "open" ? me.id : null };
  const { error } = await sb.from("conversations").update(patch).eq("id", current.id);
  if (error) return alert(error.message);
  Object.assign(current, patch); renderHead(); loadConvs();
}

function addMsg(m) {
  if (!$("#msgs") || document.getElementById("m-" + m.id)) return;
  const el = document.createElement("div");
  el.id = "m-" + m.id; el.className = "m " + m.sender;
  const who = { visitor: "Cliente", bot: "Bot", agent: "Atendente", system: "" }[m.sender];
  el.innerHTML = esc(m.body) + cardsHtml(m.products) + (m.sender !== "system" ? `<small>${who} · ${fmt(m.created_at)}</small>` : "");
  $("#msgs").appendChild(el); $("#msgs").scrollTop = $("#msgs").scrollHeight;
}

// ---------- Cartões de produto ----------
const money = (n) => "$" + Number(n).toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function cardsHtml(list) {
  if (!Array.isArray(list) || !list.length) return "";
  return `<div class="pcards">${list.map((p) => `<a class="pcard" href="${esc(p.link)}" target="_blank">
    ${p.image ? `<img src="${esc(p.image)}" alt="">` : ""}<div><b>${esc(p.title)}</b>${money(p.price)}${p.compare_at ? `<s>${money(p.compare_at)}</s>` : ""}</div></a>`).join("")}</div>`;
}
let pickerTimer = null, pickerResults = [];
function setupPicker() {
  const picker = $("#picker"), q = $("#pq"), res = $("#picker .res");
  $("#pbtn").onclick = () => { picker.classList.toggle("open"); if (picker.classList.contains("open")) { q.focus(); if (!pickerResults.length) search(""); } };
  $("#pclose").onclick = () => picker.classList.remove("open");
  q.oninput = () => { clearTimeout(pickerTimer); pickerTimer = setTimeout(() => search(q.value), 300); };
  async function search(query) {
    res.innerHTML = '<div class="empty" style="padding:8px">Buscando...</div>';
    try {
      const r = await fetch(CHAT_FUNCTION_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "products", store_id: storeId, query }) });
      pickerResults = (await r.json()).products ?? [];
    } catch { pickerResults = []; }
    res.innerHTML = pickerResults.length ? pickerResults.map((p, i) => {
      const ok = (p.variants ?? []).some((v) => v.available);
      return `<div class="it">${p.image ? `<img src="${esc(p.image)}" alt="">` : ""}<div class="t">${esc(p.title)}<small>${money(p.price)}${p.compare_at ? ` <s>${money(p.compare_at)}</s>` : ""} ${ok ? "" : '· <span class="oos">esgotado</span>'}</small></div><button type="button" class="primary" data-i="${i}">Enviar</button></div>`;
    }).join("") : '<div class="empty" style="padding:8px">Nenhum produto encontrado.</div>';
    res.querySelectorAll("button[data-i]").forEach((b) => b.onclick = () => sendCard(pickerResults[b.dataset.i], b));
  }
}
async function sendCard(p, btn) {
  if (!p || !current) return;
  btn.disabled = true;
  const ta = $("#composer textarea");
  const body = ta.value.trim() || p.title;
  if (current.status !== "open") await setStatus("open");
  const { error } = await sb.from("messages").insert({ conversation_id: current.id, sender: "agent", agent_id: me.id, body, products: [p] });
  btn.disabled = false;
  if (error) return alert("Erro ao enviar: " + error.message);
  ta.value = ""; btn.textContent = "Enviado ✓"; setTimeout(() => { btn.textContent = "Enviar"; }, 2000);
}

function onMessage(m) {
  if (current && m.conversation_id === current.id) addMsg(m);
  const c = convs.find((x) => x.id === m.conversation_id);
  if (m.sender === "visitor" && c && c.status !== "bot" && document.hidden && "Notification" in window && Notification.permission === "granted") {
    new Notification("Nova mensagem no chat", { body: m.body.slice(0, 120) });
  }
  lastMsg[m.conversation_id] = m; renderList();
}
</script>
</body>
</html>
